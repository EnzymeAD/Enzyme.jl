name: 'Format'

on:
  pull_request:
    paths: ['**/*.jl']
  push:
    branches:
      - main
    paths: ['**/*.jl']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  runic:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Setup Julia
        uses: julia-actions/setup-julia@v3
        with:
          version: '1'
          arch: 'x64'
      - uses: julia-actions/cache@v3

      - name: Install Runic
        run: |
          # Keep in sync with .pre-commit-config.yaml
          julia --project=@runic -e 'using Pkg; Pkg.add(name="Runic", version="1.11.1")'

      - name: Run Runic
        run: julia --project=@runic -m Runic --check --diff .
