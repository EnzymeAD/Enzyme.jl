# MI300A (gfx942) on beverin's mi300 partition. The job template is in ci/cscs-common.yml.
# Julia >= 1.12 only: the LLVM of older versions does not know gfx942.
include:
  - remote: 'https://gitlab.com/cscs-ci/recipes/-/raw/master/templates/v2/.ci-ext.yml'
  - local: 'ci/cscs-common.yml'

.amdgpu_runner:
  extends: .baremetal-runner-beverin-mi300

AMDGPU julia 1.12:
  extends: [.amdgpu_runner, .amdgpu_test]
  variables:
    JULIA: '/users/lraess/julia_amd/julia_amd-1.12'

AMDGPU julia 1.13:
  extends: [.amdgpu_runner, .amdgpu_test]
  variables:
    JULIA: '/users/lraess/julia_amd/julia_amd-1.13'
