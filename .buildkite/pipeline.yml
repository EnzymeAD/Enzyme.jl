steps:
  - label: "CUDA Julia v{{matrix.version}} - GPUCompiler {{matrix.gpucompiler}}"
    matrix:
      setup:
        version:
          - "1.10"
          - "1.11"
          - "1.12"
        # The default resolution now picks GPUCompiler 2.x, and with it the CUDA release
        # built against it; "1" pins the 1.x compatibility path instead.
        gpucompiler:
          - "default"
          - "1"
      adjustments:
        - with:
            version: "1.11"
            gpucompiler: "1"
          skip: "GPU runners are scarce; 1.10 and 1.12 cover GPUCompiler 1.x"
    plugins:
      - JuliaCI/julia#v1:
          version: "{{matrix.version}}"
      - JuliaCI/julia-coverage#v1: ~
    agents:
      queue: "cuda"
    if: build.message !~ /\[skip tests\]/
    timeout_in_minutes: 60
    commands: |
      echo "--- Setup Julia packages"
      JULIA_PKG_PRECOMPILE_AUTO="false" julia --color=yes -e '
          using Pkg
          specs = [PackageSpec(; name="CUDA", version="6")]
          gpucompiler = "{{matrix.gpucompiler}}"
          if gpucompiler != "default"
              push!(specs, PackageSpec(; name="GPUCompiler", version=gpucompiler))
          end
          # Resolve the pin before developing Enzyme. The other order lets `develop`
          # resolve GPUCompiler at its default and install 2.x, only for the pin to
          # downgrade it again.
          Pkg.add(specs)
          pkgs = [PackageSpec(; path) for path in (".", "lib/EnzymeCore", "lib/EnzymeTestUtils")]
          Pkg.develop(pkgs)
          Pkg.status()
          # `Pkg.develop` re-resolves and nothing forces it to keep the pin; fail loudly
          # rather than let this job silently duplicate the default-resolution one.
          # (No Julia string interpolation here: buildkite would eat the dollar sign.)
          if gpucompiler != "default"
              v = Pkg.dependencies()[Base.UUID("61eb1bfa-7361-4325-ad38-22787b887f55")].version
              v < VersionNumber(parse(Int, gpucompiler) + 1) ||
                  error(string("GPUCompiler pin did not hold, resolved ", v))
          end' || exit 3

      echo "+++ Run tests"
      julia --color=yes --code-coverage=@ test/cuda.jl
    env:
      JULIA_PKG_SERVER_REGISTRY_PREFERENCE: eager

