  - label: "Metal Julia v{{matrix.version}}"
    matrix:
      setup:
        version:
          - "1.10"
          - "1.11"
          - "1.12"
    plugins:
      - JuliaCI/julia#v1:
          version: "{{matrix.version}}"
      - JuliaCI/julia-coverage#v1: ~
    agents:
      queue: "metal"
    if: build.message !~ /\[skip tests\]/
    timeout_in_minutes: 60
    commands: |
      echo "--- Setup Julia packages"
      julia --color=yes -e '
          using Pkg
          pkgs = [PackageSpec(; path) for path in (".", "lib/EnzymeCore", "lib/EnzymeTestUtils")]
          Pkg.develop(pkgs)
          Pkg.add([PackageSpec(; name="Metal")])' || exit 3

      echo "+++ Run tests"
      julia --color=yes --code-coverage=@ test/metal.jl
    env:
      JULIA_PKG_SERVER_REGISTRY_PREFERENCE: eager

