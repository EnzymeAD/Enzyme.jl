steps:
  - label: "CUDA Julia v{{matrix.version}}"
    matrix:
      setup:
        version:
          - "1.10"
          - "1.11"
          - "1.12"
    plugins:
      - JuliaCI/julia#v1:
          version: "{{matrix.version}}"
      - JuliaCI/julia-coverage#v1: ~
    agents:
      queue: "cuda"
    if: build.message !~ /\[skip tests\]/
    timeout_in_minutes: 60
    commands: |
      echo "--- Setup Julia packages"
      JULIA_PKG_PRECOMPILE_AUTO="false" julia --color=yes -e '
          using Pkg
          pkgs = [PackageSpec(; path) for path in (".", "lib/EnzymeCore", "lib/EnzymeTestUtils")]
          Pkg.develop(pkgs)
          Pkg.add([PackageSpec(; name="CUDA", version="6"), PackageSpec(; name = "MetaTesting", version = "0.1.0")])' || exit 3

      echo "+++ Run tests"
      julia --color=yes --code-coverage=@ test/cuda.jl
      julia --color=yes --code-coverage=@ lib/EnzymeTestUtils/test/cuda_to_vec.jl
      julia --color=yes --code-coverage=@ lib/EnzymeTestUtils/test/cuda_test_reverse.jl
      julia --color=yes --code-coverage=@ lib/EnzymeTestUtils/test/cuda_test_forward.jl
    env:
      JULIA_PKG_SERVER_REGISTRY_PREFERENCE: eager

