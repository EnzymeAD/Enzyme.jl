steps:
  - label: "CUDA Julia v{{matrix.version}} - GPUCompiler {{matrix.gpucompiler}}"
    matrix:
      setup:
        version:
          - "1.10"
          - "1.11"
          - "1.12"
        # The default resolution picks GPUCompiler 2.x, and with it CUDA 6.3, whose
        # CUDACore requires it. "1" pins the 1.x compatibility path instead, which backs
        # CUDA down to 6.2, the last release that resolves against GPUCompiler 1.
        gpucompiler:
          - "default"
          - "1"
      adjustments:
        - with:
            version: "1.11"
            gpucompiler: "1"
          skip: "GPU runners are scarce; 1.10 and 1.12 cover GPUCompiler 1.x"
    plugins:
      - JuliaCI/julia#v1:
          version: "{{matrix.version}}"
      - JuliaCI/julia-coverage#v1: ~
    agents:
      queue: "cuda"
    if: build.message !~ /\[skip tests\]/
    timeout_in_minutes: 60
    commands: |
      echo "--- Setup Julia packages"
      JULIA_PKG_PRECOMPILE_AUTO="false" julia --color=yes -e '
          using Pkg
          specs = [PackageSpec(; name="CUDA", version="6")]
          gpucompiler = "{{matrix.gpucompiler}}"
          if gpucompiler != "default"
              push!(specs, PackageSpec(; name="GPUCompiler", version=gpucompiler))
          end
          Pkg.add(specs)
          # A version bound handed to `add` is not recorded anywhere, so the re-resolve
          # `Pkg.develop` triggers below would be free to upgrade back to the default.
          # Pin instead; `pin` only accepts direct dependencies, hence the `add` above.
          gpucompiler == "default" || Pkg.pin("GPUCompiler")
          pkgs = [PackageSpec(; path) for path in (".", "lib/EnzymeCore", "lib/EnzymeTestUtils")]
          Pkg.develop(pkgs)
          Pkg.status()' || exit 3

      echo "+++ Run tests"
      julia --color=yes --code-coverage=@ test/cuda.jl
    env:
      JULIA_PKG_SERVER_REGISTRY_PREFERENCE: eager

